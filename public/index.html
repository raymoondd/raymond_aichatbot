<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nexus AI Chatbot</title>
  <link rel="stylesheet" href="style.css" />
  <!-- Marked Library for safe Markdown rendering -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <!-- DOMPurify to sanitize HTML output -->
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
</head>
<body>
  <div class="chat-container">
    <header class="chat-header">
      <div class="brand">
        <div class="avatar-status">
          <div class="bot-avatar">🤖</div>
          <span class="status-indicator"></span>
        </div>
        <div class="title-wrap">
          <h1>Raymond AI</h1>
          <p class="subtitle">Smart Assistant</p>
        </div>
      </div>
      <button id="clear-btn" class="icon-btn" title="Clear Conversation" aria-label="Clear Conversation">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></svg>
      </button>
    </header>

    <main id="chat-messages" class="chat-messages" aria-live="polite">
      <div class="message system-welcome">
        <div class="message-content">
          👋 Hello I'm <b>Raymond</b>! What's on your mind?
        </div>
      </div>
    </main>

    <div id="typing-indicator" class="typing-indicator hidden">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>

    <footer class="chat-input-container">
      <form id="chat-form" class="input-form">
        <textarea
          id="user-input"
          placeholder="Type a message..."
          rows="1"
          required
          aria-label="Type your message"
        ></textarea>
        <button type="submit" id="send-btn" class="send-btn" aria-label="Send Message">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>
        </button>
      </form>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
